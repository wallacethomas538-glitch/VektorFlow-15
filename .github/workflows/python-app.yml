name: VEKTORFLOW-15

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
      - name: Lint
        run: |
          flake8 vektorflow tests vektorflow_15.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 vektorflow tests vektorflow_15.py --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics
      - name: Test
        run: pytest
