name: 🧪 VEKTORFLOW-15 Tests
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install fastapi uvicorn pydantic httpx
    - run: python vektorflow_15.py &
    - run: sleep 5
    - run: |
        PASS=0 FAIL=0 BASE="http://localhost:8000"
        for endpoint in product-description supplier-finder store-builder creative-factory ad-manager chatbot dynamic-pricing compliance-audit tts/synthesize viral-detector competitor-shadow bundle-builder sentiment-pivot profit-predictor universal/push-product universal/platforms; do
          echo -n "$endpoint... "
          if curl -s -X POST "$BASE/api/v1/$endpoint" -H "Content-Type: application/json" -H "X-API-Key: test" -d '{}' | grep -q "VEKTORFLOW"; then echo "✅"; PASS=$((PASS+1)); else echo "❌"; FAIL=$((FAIL+1)); fi
        done
        echo "RESULTS: $PASS/16 passed, $FAIL failed"
        if [ $FAIL -gt 0 ]; then exit 1; fi
